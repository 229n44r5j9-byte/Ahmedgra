<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ahmedgram - Full Social Network</title>

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Plus Jakarta Sans', -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06030d;
      color: #ffffff;
    }

    /* Fullscreen Responsive Container */
    .app-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: radial-gradient(circle at top left, #1a0b2e, #090514, #000000);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Auth Screen Overlay */
    .auth-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 5, 20, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 500;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      animation: fadeIn 0.3s ease;
    }

    /* Header Transparent Glass */
    .header {
      height: 60px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(18, 12, 38, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 10;
      position: sticky;
      top: 0;
    }

    .header-logo {
      font-size: 22px;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-icons i {
      font-size: 20px;
      margin-left: 16px;
      cursor: pointer;
      color: #e2e8f0;
      transition: transform 0.2s ease;
    }
    .header-icons i:active { transform: scale(0.85); }

    /* Screens Container & Smooth Scroll */
    .screen {
      flex: 1;
      overflow-y: auto;
      display: none;
      padding-bottom: 90px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .screen.active {
      display: block;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .screen::-webkit-scrollbar { display: none; }

    /* Stories Bar */
    .stories-container {
      display: flex;
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
      gap: 14px;
      background: rgba(0, 0, 0, 0.2);
    }
    .stories-container::-webkit-scrollbar { display: none; }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 68px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }

    .story-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #a855f7, #ec4899, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .story-ring:active { transform: scale(0.92); }

    .story-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #0f0a1c;
    }

    .add-story-btn {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid #0f0a1c;
    }

    .story-username {
      font-size: 11px;
      margin-top: 5px;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cbd5e1;
    }

    /* Developer Badges & Frame */
    .dev-badge { color: #38bdf8; font-size: 12px; margin-right: 4px; }
    .dev-tag { background: #0284c7; color: white; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

    /* Post Card UI */
    .post-card {
      margin: 14px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
    }

    .post-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); }

    .post-img { width: 100%; max-height: 480px; object-fit: cover; }

    .post-actions { display: flex; align-items: center; gap: 16px; padding: 12px 14px; font-size: 20px; }
    .post-actions i { cursor: pointer; transition: transform 0.15s ease; }
    .post-actions i:active { transform: scale(1.3); }

    .post-likes-count { font-size: 13px; font-weight: bold; padding: 0 14px 4px; color: #e2e8f0; cursor: pointer; }
    .post-caption { font-size: 13px; padding: 0 14px 12px; color: #cbd5e1; }

    .comments-preview {
      padding: 4px 14px 12px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
    }

    /* Story Fullscreen Viewer */
    .story-viewer-modal {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    .story-progress-bar { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
    .story-progress-fill { height: 100%; width: 0%; background: #a855f7; transition: width 0.1s linear; }

    .story-viewer-header { display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .story-viewer-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .story-viewer-content img { width: 100%; height: 100%; object-fit: contain; }

    .story-footer-actions {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Floating iOS Dock Bottom Nav (Transparent) */
    .bottom-nav-container {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      height: 60px;
      background: rgba(18, 12, 38, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 35px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .nav-icon { font-size: 20px; color: #94a3b8; cursor: pointer; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
    .nav-icon.active { color: #a855f7; transform: translateY(-4px) scale(1.2); text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }

    /* Forms & Inputs */
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus { border-color: #a855f7; }

    .neon-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: transform 0.15s ease;
    }
    .neon-btn:active { transform: scale(0.98); }

    .user-search-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
    }

    .action-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
    }

    /* Modal Sheet for Comments/Likes */
    .modal-sheet {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px);
      z-index: 700;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
    }
    .modal-sheet-content {
      background: #120c26;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Auth Screen Overlay -->
  <div id="authScreen" class="auth-overlay">
    <h2 class="header-logo" style="text-align: center; margin-bottom: 20px; font-size: 32px;">Ahmedgram</h2>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <input type="text" id="loginUsername" class="form-input" placeholder="اسم المستخدم (Username)">
      <input type="password" id="loginPassword" class="form-input" placeholder="كلمة المرور">
      <button onclick="loginUser()" class="neon-btn">تسجيل الدخول</button>
      <button onclick="registerUser()" class="neon-btn" style="background: rgba(255, 255, 255, 0.1); box-shadow:none;">إنشاء حساب جديد</button>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-logo">Ahmedgram</div>
    <div class="header-icons">
      <i class="fa-solid fa-plus-square" onclick="openCreatePostModal()" title="إضافة منشور"></i>
      <i class="fa-solid fa-bell" onclick="switchTab('notificationsTab')" title="الإشعارات" style="position:relative;">
        <span id="notifBadge" style="position:absolute; top:-5px; right:-8px; background:#ec4899; width:8px; height:8px; border-radius:50%; display:none;"></span>
      </i>
      <i class="fa-solid fa-paper-plane" onclick="switchTab('chatTab')"></i>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div id="createPostModal" class="auth-overlay" style="display:none; z-index:600;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3>إضافة منشور جديد 📸</h3>
      <i class="fa-solid fa-xmark" onclick="closeCreatePostModal()" style="font-size:20px; cursor:pointer;"></i>
    </div>
    <div style="display:flex; flex-direction:column; gap:14px;">
      <input type="file" id="postImageInput" accept="image/*" class="form-input">
      <textarea id="postCaptionInput" class="form-input" rows="3" placeholder="اكتب وصف المنشور..."></textarea>
      <button onclick="publishPost()" class="neon-btn">نشر الآن</button>
    </div>
  </div>

  <!-- Story Fullscreen Viewer -->
  <div id="storyViewer" class="story-viewer-modal">
    <div>
      <div class="story-progress-bar">
        <div id="storyProgressFill" class="story-progress-fill"></div>
      </div>
      <div class="story-viewer-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <img id="storyViewerAvatar" src="" style="width:38px; height:38px; border-radius:50%; object-fit:cover;">
          <span id="storyViewerUsername" style="font-weight:bold; font-size:14px;"></span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
          <i id="storyDeleteBtn" class="fa-solid fa-trash" onclick="deleteCurrentStory()" style="font-size:18px; color:#ef4444; cursor:pointer; display:none;"></i>
          <i class="fa-solid fa-xmark" onclick="closeStoryViewer()" style="font-size:24px; cursor:pointer;"></i>
        </div>
      </div>
    </div>
    <div class="story-viewer-content">
      <img id="storyViewerImg" src="">
    </div>
    <div class="story-footer-actions">
      <div style="display:flex; align-items:center; gap:10px;">
        <i id="storyLikeBtn" class="fa-regular fa-heart" onclick="toggleStoryLike()" style="font-size:24px; color:#ec4899; cursor:pointer;"></i>
        <span id="storyLikesCount" style="font-size:13px; color:#e2e8f0;">0 إعجاب</span>
      </div>
    </div>
  </div>

  <!-- Likes and Comments Sheet Modal -->
  <div id="interactionModal" class="modal-sheet">
    <div class="modal-sheet-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h4 id="interactionModalTitle">التفاعلات</h4>
        <i class="fa-solid fa-xmark" onclick="closeInteractionModal()" style="cursor:pointer; font-size:18px;"></i>
      </div>
      <div id="interactionList" style="overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px;"></div>
      <div id="commentInputBox" style="display:none; margin-top:10px; display:flex; gap:8px;">
        <input type="text" id="newCommentText" class="form-input" placeholder="اكتب تعليقاً...">
        <button onclick="submitComment()" class="neon-btn" style="width:auto; padding:0 18px;">نشر</button>
      </div>
    </div>
  </div>

  <!-- Screen 1: Feed -->
  <div id="homeTab" class="screen active">
    <div class="stories-container" id="storiesList">
      <div class="story-item">
        <div class="story-ring" id="myStoryRing" onclick="triggerStoryUpload()">
          <img src="https://via.placeholder.com/150" class="story-img" id="homeMyAvatar">
          <div class="add-story-btn">+</div>
        </div>
        <span class="story-username">قصتك</span>
        <input type="file" id="storyFileInput" accept="image/*" style="display:none;" onchange="uploadStory(event)">
      </div>
      <div id="otherStoriesList" style="display:flex; gap:14px;"></div>
    </div>

    <!-- Feed Posts Container -->
    <div id="feedList"></div>
  </div>

  <!-- Screen 2: Reels -->
  <div id="reelsTab" class="screen">
    <div style="padding: 40px 20px; text-align: center;">
      <h3 style="color:#a855f7; font-size:22px; margin-bottom:8px;">Ahmedgram Reels</h3>
      <p style="color:#94a3b8; font-size:14px;">قريباً.. تصفح مقاطع الفيديو القصيرة بجودة عالية.</p>
    </div>
  </div>

  <!-- Screen 3: Private Chat Inbox & Direct Chat Room -->
  <div id="chatTab" class="screen">
    <div style="padding:16px; font-weight:bold; font-family:'Orbitron'; font-size:18px; border-bottom:1px solid rgba(255,255,255,0.05);">الرسائل الخاصة (DM)</div>
    <div id="chatInboxArea" style="padding:12px;">
      <div style="text-align:center; color:#94a3b8; font-size:13px; margin-top:20px;">ابحث عن أي شخص واضغط "إرسال رسالة" لبدء الشات الفوري!</div>
    </div>
    <!-- Active Chat Room Container -->
    <div id="chatRoomArea" style="display:none; flex-direction:column; height:calc(100vh - 120px); position:relative;">
      <div style="padding:12px; background:rgba(255,255,255,0.02); display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <i class="fa-solid fa-arrow-right" onclick="closeChatRoom()" style="cursor:pointer; font-size:16px;"></i>
        <img id="activeChatAvatar" src="" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
        <span id="activeChatUsername" style="font-weight:bold; font-size:14px;"></span>
      </div>
      <div id="chatMessagesList" style="flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;"></div>
      <div style="padding:10px; display:flex; gap:8px; background:rgba(0,0,0,0.3);">
        <input type="text" id="chatMessageInput" class="form-input" placeholder="اكتب رسالتك...">
        <button onclick="sendDirectMessage()" class="neon-btn" style="width:auto; padding:0 18px;"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- Screen 4: Search -->
  <div id="searchTab" class="screen">
    <div style="padding: 16px;">
      <input type="text" id="searchInput" class="form-input" placeholder="ابحث باسم أو حرف (مثل A أو B...)" oninput="searchUsersPrefix()">
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Screen 5: Notifications Screen -->
  <div id="notificationsTab" class="screen">
    <div style="padding:16px; font-weight:bold; font-family:'Orbitron'; font-size:18px; border-bottom:1px solid rgba(255,255,255,0.05);">الإشعارات والمتابعات</div>
    <div id="notificationsList" style="padding:12px; display:flex; flex-direction:column; gap:10px;"></div>
  </div>

  <!-- Screen 6: Profile -->
  <div id="profileTab" class="screen">
    <div style="padding: 24px 20px; text-align: center;">
      <div class="story-ring" style="width: 96px; height: 96px; margin: 0 auto; position:relative; cursor:pointer;" onclick="document.getElementById('avatarFileInput').click()">
        <img id="profilePreview" src="https://via.placeholder.com/150" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
        <div style="position:absolute; bottom:0; right:0; background:#a855f7; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #0f0a1c;">
          <i class="fa-solid fa-camera" style="font-size:12px;"></i>
        </div>
      </div>
      <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="uploadProfileAvatar(event)">

      <div style="margin-top:14px; display:flex; align-items:center; justify-content:center; gap:6px;">
        <h3 id="myProfileUsername" style="color:#38bdf8; font-size:20px;">@username</h3>
        <span id="devTagBadge" class="dev-tag" style="display:none;">Developer</span>
        <i id="devVerifiedBadge" class="fa-solid fa-circle-check dev-badge" style="display:none;"></i>
      </div>

      <!-- Followers Stats Bar -->
      <div style="display:flex; justify-content:space-around; margin:18px 0; background:rgba(255,255,255,0.03); padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,0.05);">
        <div>
          <div id="followersCount" style="font-weight:bold; color:#a855f7; font-size:16px;">0</div>
          <div style="font-size:12px; color:#94a3b8;">المتابعون</div>
        </div>
        <div>
          <div id="followingCount" style="font-weight:bold; color:#ec4899; font-size:16px;">0</div>
          <div style="font-size:12px; color:#94a3b8;">يتابعهم</div>
        </div>
      </div>

      <textarea id="bioInput" class="form-input" rows="2" placeholder="اكتب البايو الخاص بك هنا..."></textarea>
      <button onclick="saveProfile()" class="neon-btn" style="margin-top:15px;">حفظ التعديلات</button>
    </div>
  </div>

  <!-- Transparent Floating Bottom Nav -->
  <div class="bottom-nav-container">
    <i class="fa-solid fa-compass nav-icon active" onclick="switchTab('homeTab', this)"></i>
    <i class="fa-solid fa-play nav-icon" onclick="switchTab('reelsTab', this)"></i>
    <i class="fa-solid fa-message nav-icon" onclick="switchTab('chatTab', this)"></i>
    <i class="fa-solid fa-globe nav-icon" onclick="switchTab('searchTab', this)"></i>
    <i class="fa-solid fa-user-astronaut nav-icon" onclick="switchTab('profileTab', this)"></i>
  </div>

</div>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://elsho3l-default-rtdb.firebaseio.com/" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentUserId = localStorage.getItem('ahmedgram_logged_user');
  let currentAvatar = "https://via.placeholder.com/150";
  let activeStoryKey = null;
  let activePostIdForInteraction = null;
  let activeChatTargetUser = null;
  let storyTimer = null;

  const DEV_USERNAME = "ahmed_ibrahim_31";

  // Auth Handling
  window.registerUser = () => {
    const user = document.getElementById('loginUsername').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value.trim();

    if (!user || !pass) return alert('يرجى كتابة اسم المستخدم وكلمة السر');

    get(ref(db, 'users_db/' + user)).then((snap) => {
      if (snap.exists()) {
        alert('اسم المستخدم مأخوذ بالفعل!');
      } else {
        set(ref(db, 'users_db/' + user), {
          username: user,
          password: pass,
          bio: 'عضو في Ahmedgram',
          avatar: currentAvatar
        }).then(() => loginSuccess(user));
      }
    });
  };

  window.loginUser = () => {
    const user = document.getElementById('loginUsername').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value.trim();

    get(ref(db, 'users_db/' + user)).then((snap) => {
      if (snap.exists() && snap.val().password === pass) {
        loginSuccess(user);
      } else {
        alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
      }
    });
  };

  function loginSuccess(user) {
    currentUserId = user;
    localStorage.setItem('ahmedgram_logged_user', user);
    document.getElementById('authScreen').style.display = 'none';
    loadMyProfile();
    loadFeedPosts();
    loadStories();
    updateFollowersCount();
    loadNotifications();
  }

  if (currentUserId) {
    document.getElementById('authScreen').style.display = 'none';
    loadMyProfile();
    loadFeedPosts();
    loadStories();
    updateFollowersCount();
    loadNotifications();
  }

  function loadMyProfile() {
    get(ref(db, 'users_db/' + currentUserId)).then((snap) => {
      if (snap.exists()) {
        const data = snap.val();
        const isDev = (currentUserId === DEV_USERNAME);

        document.getElementById('myProfileUsername').innerText = '@' + data.username;
        document.getElementById('bioInput').value = data.bio || '';
        
        document.getElementById('devTagBadge').style.display = isDev ? 'inline' : 'none';
        document.getElementById('devVerifiedBadge').style.display = isDev ? 'inline' : 'none';

        if (data.avatar) {
          currentAvatar = data.avatar;
          document.getElementById('profilePreview').src = data.avatar;
          document.getElementById('homeMyAvatar').src = data.avatar;
        }
      }
    });
  }

  window.uploadProfileAvatar = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const imgData = event.target.result;
      currentAvatar = imgData;
      document.getElementById('profilePreview').src = imgData;
      document.getElementById('homeMyAvatar').src = imgData;
      set(ref(db, `users_db/${currentUserId}/avatar`), imgData);
    };
    reader.readAsDataURL(file);
  };

  // Prefix Autocomplete Search & Dynamic Action Buttons (Follow / Chat)
  window.searchUsersPrefix = () => {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const container = document.getElementById('searchResults');
    container.innerHTML = '';

    if (!query) return;

    get(ref(db, 'users_db')).then((snap) => {
      if (snap.exists()) {
        const users = snap.val();
        Object.keys(users).forEach(uKey => {
          if (uKey.startsWith(query) && uKey !== currentUserId) {
            const user = users[uKey];
            const isDev = (uKey === DEV_USERNAME);

            const card = document.createElement('div');
            card.className = 'user-search-card';
            card.innerHTML = `
              <div style="display:flex; align-items:center; gap:10px;">
                <img src="${user.avatar || 'https://via.placeholder.com/150'}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                <div>
                  <div style="font-weight:bold; font-size:14px; ${isDev ? 'color:#38bdf8;' : ''}">
                    ${user.username} ${isDev ? '<i class="fa-solid fa-circle-check dev-badge"></i>' : ''}
                  </div>
                  <div style="font-size:11px; color:#94a3b8;">${user.bio || ''}</div>
                </div>
              </div>
              <div style="display:flex; gap:6px;">
                <button class="action-btn" id="followBtn_${user.username}" onclick="toggleFollow('${user.username}', '${user.avatar || ''}')">متابعة</button>
                <button class="action-btn secondary" onclick="openChatRoom('${user.username}', '${user.avatar || ''}')"><i class="fa-solid fa-message"></i></button>
              </div>
            `;
            container.appendChild(card);
            checkFollowStatus(user.username);
          }
        });
      }
    });
  };

  function checkFollowStatus(targetUser) {
    get(ref(db, `follows/${currentUserId}/${targetUser}`)).then((snap) => {
      const btn = document.getElementById(`followBtn_${targetUser}`);
      if (btn && snap.exists() && snap.val() === true) {
        btn.innerText = 'إرسال رسالة';
        btn.classList.add('secondary');
        btn.onclick = () => openChatRoom(targetUser);
      }
    });
  }

  window.toggleFollow = (targetUser, avatar) => {
    const followRef = ref(db, `follows/${currentUserId}/${targetUser}`);
    get(followRef).then((snap) => {
      const btn = document.getElementById(`followBtn_${targetUser}`);
      if (snap.exists() && snap.val() === true) {
        set(followRef, false);
        set(ref(db, `followers/${targetUser}/${currentUserId}`), false);
        if(btn) {
          btn.innerText = 'متابعة';
          btn.classList.remove('secondary');
          btn.onclick = () => toggleFollow(targetUser, avatar);
        }
      } else {
        set(followRef, true);
        set(ref(db, `followers/${targetUser}/${currentUserId}`), true);
        
        // Push Notification for Follower
        push(ref(db, `notifications/${targetUser}`), {
          from: currentUserId,
          avatar: currentAvatar,
          type: 'follow',
          timestamp: Date.now()
        });

        if(btn) {
          btn.innerText = 'إرسال رسالة';
          btn.classList.add('secondary');
          btn.onclick = () => openChatRoom(targetUser, avatar);
        }
      }
      updateFollowersCount();
    });
  };

  function updateFollowersCount() {
    get(ref(db, `followers/${currentUserId}`)).then((snap) => {
      let count = 0;
      if (snap.exists()) {
        const data = snap.val();
        Object.keys(data).forEach(k => { if(data[k]) count++; });
      }
      document.getElementById('followersCount').innerText = (currentUserId === DEV_USERNAME) ? '41M' : count;
    });

    get(ref(db, `follows/${currentUserId}`)).then((snap) => {
      let count = 0;
      if (snap.exists()) {
        const data = snap.val();
        Object.keys(data).forEach(k => { if(data[k]) count++; });
      }
      document.getElementById('followingCount').innerText = count;
    });
  }

  // Notifications System & Follow Back
  function loadNotifications() {
    onValue(ref(db, `notifications/${currentUserId}`), (snap) => {
      const container = document.getElementById('notificationsList');
      container.innerHTML = '';
      const badge = document.getElementById('notifBadge');

      if (snap.exists()) {
        badge.style.display = 'block';
        const notifs = snap.val();
        Object.keys(notifs).reverse().forEach(nId => {
          const n = notifs[nId];
          const item = document.createElement('div');
          item.className = 'user-search-card';
          item.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${n.avatar || 'https://via.placeholder.com/150'}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
              <div style="font-size:13px;">
                <span style="font-weight:bold;">@${n.from}</span> قام بمتابعتك لتستطيع التواصل معه!
              </div>
            </div>
            <button class="action-btn" onclick="toggleFollow('${n.from}', '${n.avatar}')">فولو باك</button>
          `;
          container.appendChild(item);
        });
      } else {
        badge.style.display = 'none';
        container.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:13px; margin-top:20px;">لا توجد إشعارات جديدة حالياً.</div>';
      }
    });
  }

  // Private Messaging (DM) System
  window.openChatRoom = (targetUser, avatar) => {
    activeChatTargetUser = targetUser;
    document.getElementById('chatInboxArea').style.display = 'none';
    document.getElementById('activeChatUsername').innerText = '@' + targetUser;
    if(avatar) document.getElementById('activeChatAvatar').src = avatar;
    document.getElementById('chatRoomArea').style.display = 'flex';

    loadChatMessages();
  };

  window.closeChatRoom = () => {
    activeChatTargetUser = null;
    document.getElementById('chatRoomArea').style.display = 'none';
    document.getElementById('chatInboxArea').style.display = 'block';
  };

  const getChatRoomId = (u1, u2) => [u1, u2].sort().join('_');

  window.sendDirectMessage = () => {
    const input = document.getElementById('chatMessageInput');
    const text = input.value.trim();
    if(!text || !activeChatTargetUser) return;

    const roomId = getChatRoomId(currentUserId, activeChatTargetUser);
    push(ref(db, `chats/${roomId}`), {
      sender: currentUserId,
      text: text,
      timestamp: Date.now()
    }).then(() => {
      input.value = '';
    });
  };

  function loadChatMessages() {
    if(!activeChatTargetUser) return;
    const roomId = getChatRoomId(currentUserId, activeChatTargetUser);

    onValue(ref(db, `chats/${roomId}`), (snap) => {
      const list = document.getElementById('chatMessagesList');
      list.innerHTML = '';
      if(snap.exists()) {
        const msgs = snap.val();
        Object.keys(msgs).forEach(mKey => {
          const m = msgs[mKey];
          const isMe = (m.sender === currentUserId);
          const div = document.createElement('div');
          div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
          div.style.background = isMe ? 'linear-gradient(135deg, #a855f7, #ec4899)' : 'rgba(255,255,255,0.08)';
          div.style.padding = '8px 14px';
          div.style.borderRadius = '14px';
          div.style.maxWidth = '75%';
          div.style.fontSize = '13px';
          div.innerText = m.text;
          list.appendChild(div);
        });
        list.scrollTop = list.scrollHeight;
      }
    });
  }

  // Story System & Deletion Support
  window.triggerStoryUpload = () => document.getElementById('storyFileInput').click();

  window.uploadStory = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      push(ref(db, 'stories'), {
        username: currentUserId,
        avatar: currentAvatar,
        image: event.target.result,
        timestamp: Date.now()
      }).then(() => {
        alert('تم نشر الستوري بنجاح!');
        loadStories();
      });
    };
    reader.readAsDataURL(file);
  };

  function loadStories() {
    onValue(ref(db, 'stories'), (snap) => {
      const container = document.getElementById('otherStoriesList');
      container.innerHTML = '';

      if (snap.exists()) {
        const stories = snap.val();
        Object.keys(stories).reverse().forEach(sId => {
          const s = stories[sId];
          const storyEl = document.createElement('div');
          storyEl.className = 'story-item';
          storyEl.onclick = () => openStoryViewer(sId, s);
          storyEl.innerHTML = `
            <div class="story-ring">
              <img src="${s.avatar || 'https://via.placeholder.com/150'}" class="story-img">
            </div>
            <span class="story-username">${s.username}</span>
          `;
          container.appendChild(storyEl);
        });
      }
    });
  }

  function openStoryViewer(sId, story) {
    activeStoryKey = sId;
    document.getElementById('storyViewerImg').src = story.image;
    document.getElementById('storyViewerAvatar').src = story.avatar || 'https://via.placeholder.com/150';
    document.getElementById('storyViewerUsername').innerText = story.username;
    
    // Show delete button if owner
    document.getElementById('storyDeleteBtn').style.display = (story.username === currentUserId) ? 'inline' : 'none';
    document.getElementById('storyViewer').style.display = 'flex';

    const fill = document.getElementById('storyProgressFill');
    fill.style.width = '0%';
    let p = 0;
    clearInterval(storyTimer);
    storyTimer = setInterval(() => {
      p += 2;
      fill.style.width = p + '%';
      if (p >= 100) {
        clearInterval(storyTimer);
        closeStoryViewer();
      }
    }, 100);
  }

  window.closeStoryViewer = () => {
    clearInterval(storyTimer);
    document.getElementById('storyViewer').style.display = 'none';
  };

  window.deleteCurrentStory = () => {
    if (activeStoryKey) {
      remove(ref(db, `stories/${activeStoryKey}`)).then(() => {
        closeStoryViewer();
        loadStories();
      });
    }
  };

  // Feed Posts & Post Deletion Support
  window.openCreatePostModal = () => document.getElementById('createPostModal').style.display = 'flex';
  window.closeCreatePostModal = () => document.getElementById('createPostModal').style.display = 'none';

  window.publishPost = () => {
    const file = document.getElementById('postImageInput').files[0];
    const caption = document.getElementById('postCaptionInput').value.trim();

    if (!file) return alert('الرجاء اختيار صورة المنشور!');

    const reader = new FileReader();
    reader.onload = (e) => {
      push(ref(db, 'posts'), {
        username: currentUserId,
        avatar: currentAvatar,
        image: e.target.result,
        caption: caption,
        timestamp: Date.now()
      }).then(() => {
        closeCreatePostModal();
        loadFeedPosts();
      });
    };
    reader.readAsDataURL(file);
  };

  function loadFeedPosts() {
    onValue(ref(db, 'posts'), (snap) => {
      const feed = document.getElementById('feedList');
      feed.innerHTML = '';
      if (snap.exists()) {
        const posts = snap.val();
        Object.keys(posts).reverse().forEach(pId => {
          const p = posts[pId];
          const isDev = (p.username === DEV_USERNAME);
          const isMyPost = (p.username === currentUserId);

          const postEl = document.createElement('div');
          postEl.className = 'post-card';
          postEl.innerHTML = `
            <div class="post-header">
              <div style="display:flex; align-items:center; gap:10px;">
                <img src="${p.avatar || 'https://via.placeholder.com/150'}" class="post-avatar">
                <span style="font-weight:bold; font-size:13px; ${isDev ? 'color:#38bdf8;' : ''}">
                  ${p.username} ${isDev ? '<span class="dev-tag">Developer</span> <i class="fa-solid fa-circle-check dev-badge"></i>' : ''}
                </span>
              </div>
              ${isMyPost ? `<i class="fa-solid fa-trash" onclick="deletePost('${pId}')" style="color:#ef4444; cursor:pointer; font-size:16px; padding:4px;"></i>` : ''}
            </div>
            <img src="${p.image}" class="post-img">
            <div class="post-actions">
              <i class="fa-regular fa-heart" id="likeIcon_${pId}" onclick="likePost('${pId}')" style="color:#ec4899;"></i>
              <i class="fa-regular fa-comment" onclick="showCommentsSheet('${pId}')"></i>
            </div>
            <div class="post-likes-count" onclick="showLikesSheet('${pId}')"><span id="likes_${pId}">0</span> إعجاب</div>
            <div class="post-caption"><span style="font-weight:bold;">${p.username}</span> ${p.caption || ''}</div>
            <div class="comments-preview" onclick="showCommentsSheet('${pId}')">عرض التعليقات...</div>
          `;
          feed.appendChild(postEl);
          updatePostLikesUI(pId);
        });
      }
    });
  }

  window.deletePost = (pId) => {
    if (confirm('هل أنت متأكد من حذف هذا المنشور؟')) {
      remove(ref(db, `posts/${pId}`)).then(() => {
        loadFeedPosts();
      });
    }
  };

  window.likePost = (postId) => {
    const likeRef = ref(db, `post_likes/${postId}/${currentUserId}`);
    get(likeRef).then((snap) => {
      if (snap.exists() && snap.val() === true) {
        set(likeRef, false);
      } else {
        set(likeRef, true);
      }
      updatePostLikesUI(postId);
    });
  };

  function updatePostLikesUI(postId) {
    get(ref(db, `post_likes/${postId}`)).then((snap) => {
      let count = 0;
      let likedByMe = false;
      if (snap.exists()) {
        const likes = snap.val();
        Object.keys(likes).forEach(user => {
          if (likes[user]) {
            count++;
            if (user === currentUserId) likedByMe = true;
          }
        });
      }
      const countEl = document.getElementById(`likes_${postId}`);
      if(countEl) countEl.innerText = count;

      const icon = document.getElementById(`likeIcon_${postId}`);
      if(icon) {
        if(likedByMe) {
          icon.classList.replace('fa-regular', 'fa-solid');
        } else {
          icon.classList.replace('fa-solid', 'fa-regular');
        }
      }
    });
  }

  window.showLikesSheet = (postId) => {
    const modal = document.getElementById('interactionModal');
    const title = document.getElementById('interactionModalTitle');
    const list = document.getElementById('interactionList');
    document.getElementById('commentInputBox').style.display = 'none';

    title.innerText = 'الأشخاص المعجبون';
    list.innerHTML = '';
    modal.style.display = 'flex';

    get(ref(db, `post_likes/${postId}`)).then((snap) => {
      if (snap.exists()) {
        const likes = snap.val();
        Object.keys(likes).forEach(user => {
          if (likes[user]) {
            const item = document.createElement('div');
            item.style.display = 'flex';
            item.style.justifyContent = 'space-between';
            item.style.alignItems = 'center';
            item.innerHTML = `
              <span style="font-weight:bold;">@${user}</span>
              <button class="action-btn" onclick="openChatRoom('${user}')">مراسلة</button>
            `;
            list.appendChild(item);
          }
        });
      }
    });
  };

  window.showCommentsSheet = (postId) => {
    activePostIdForInteraction = postId;
    const modal = document.getElementById('interactionModal');
    const title = document.getElementById('interactionModalTitle');
    const list = document.getElementById('interactionList');
    document.getElementById('commentInputBox').style.display = 'flex';

    title.innerText = 'التعليقات';
    list.innerHTML = '';
    modal.style.display = 'flex';

    loadCommentsList(postId);
  };

  function loadCommentsList(postId) {
    onValue(ref(db, `post_comments/${postId}`), (snap) => {
      const list = document.getElementById('interactionList');
      list.innerHTML = '';
      if (snap.exists()) {
        const comments = snap.val();
        Object.keys(comments).forEach(cId => {
          const c = comments[cId];
          const item = document.createElement('div');
          item.style.padding = '8px 0';
          item.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
          item.innerHTML = `
            <div style="font-size:12px; font-weight:bold; color:#a855f7;">@${c.username}</div>
            <div style="font-size:13px; color:#e2e8f0; margin-top:2px;">${c.text}</div>
          `;
          list.appendChild(item);
        });
      }
    });
  }

  window.submitComment = () => {
    const input = document.getElementById('newCommentText');
    const text = input.value.trim();
    if (!text || !activePostIdForInteraction) return;

    push(ref(db, `post_comments/${activePostIdForInteraction}`), {
      username: currentUserId,
      text: text,
      timestamp: Date.now()
    }).then(() => {
      input.value = '';
    });
  };

  window.closeInteractionModal = () => {
    document.getElementById('interactionModal').style.display = 'none';
  };

  window.toggleStoryLike = () => {
    const btn = document.getElementById('storyLikeBtn');
    btn.classList.toggle('fa-solid');
    btn.classList.toggle('fa-regular');
  };

  window.switchTab = (tabId, element) => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');

    if (element) {
      document.querySelectorAll('.nav-icon').forEach(icon => icon.classList.remove('active'));
      element.classList.add('active');
    }
  };

  window.saveProfile = () => {
    set(ref(db, `users_db/${currentUserId}/bio`), document.getElementById('bioInput').value)
      .then(() => alert('تم حفظ التعديلات بنجاح!'));
  };
</script>
</body>
</html>
